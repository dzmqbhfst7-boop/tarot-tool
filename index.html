<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>塔罗解读生成器</title>
<style>
:root{
  --paper:#FBF6ED; --cream:#FFF9EE; --line:#E8D9C0; --ink:#6B4F3A;
  --soft:#9C8474; --pink:#F286A9; --coral:#EF6B45; --pinkbg:#FDEFF3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:18px 16px 40px;background:var(--paper);color:var(--ink);
  font:16px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  max-width:640px;margin:0 auto;
}
h1{font-size:22px;margin:6px 0 2px;letter-spacing:1px}
.sub{color:var(--soft);font-size:13px;margin-bottom:18px}
label{display:block;font-size:13px;color:var(--soft);margin:16px 0 6px}
input[type=text]{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--cream);font-size:16px;color:var(--ink);font-family:inherit;
}
input[type=text]:focus{outline:none;border-color:var(--pink)}
.spreads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.sp{
  padding:11px 10px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--cream);text-align:center;font-size:14px;cursor:pointer;
}
.sp.on{border-color:var(--pink);background:var(--pinkbg);color:#C4486F;font-weight:600}
.sp small{display:block;font-size:11px;color:var(--soft);font-weight:400;margin-top:2px}
.row{display:flex;gap:10px;margin-top:20px}
button{
  flex:1;padding:15px;border:none;border-radius:16px;font-size:16px;font-family:inherit;
  cursor:pointer;font-weight:600;
}
#draw{background:var(--coral);color:#fff}
#copy{background:var(--cream);color:var(--ink);border:1.5px solid var(--line)}
button:active{transform:scale(.985)}
#out{margin-top:22px;display:none}
.cardrow{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:16px;background:var(--cream);margin-bottom:8px;
}
.cardrow .idx{
  width:26px;height:26px;border-radius:50%;background:var(--pinkbg);color:#C4486F;
  display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto
}
.cardrow .nm{font-weight:600}
.cardrow .pos{font-size:12px;color:var(--soft)}
.cardrow .rev{margin-left:auto;font-size:12px;color:var(--coral)}
.cardrow img{width:44px;border-radius:5px;box-shadow:0 1px 4px rgba(107,79,58,.22);flex:0 0 auto}
.cardrow img.rev{transform:rotate(180deg)}
#share{background:var(--cream);color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
#sharewrap{margin-top:14px}
#shareimg{width:100%;border-radius:16px;border:1.5px solid var(--line);display:block}
pre{
  white-space:pre-wrap;word-wrap:break-word;background:var(--cream);
  border:1.5px solid var(--line);border-radius:16px;padding:16px;
  font:14.5px/1.75 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
  margin:0
}
.hint{font-size:12px;color:var(--soft);margin-top:10px;line-height:1.6}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
  background:#6B4F3A;color:#fff;padding:11px 20px;border-radius:20px;font-size:14px;
  opacity:0;transition:.25s;pointer-events:none
}
.toast.on{opacity:1}

.cfg{
  background:var(--cream);border:1.5px solid var(--line);border-radius:16px;
  padding:12px 14px;margin:4px 0 6px
}
.cfg summary{font-size:14px;color:var(--soft);cursor:pointer;list-style:none}
.cfg summary::-webkit-details-marker{display:none}
.cfg[open] summary{margin-bottom:6px}
#gen{
  background:var(--pink);color:#fff;margin-top:12px;display:none
}
#gen.on{display:block}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>塔罗解读生成器</h1>
<div class="sub">输入提问 → 抽牌 → 生成解读 → 复制发给客户</div>

<details class="cfg" id="cfg">
  <summary>⚙️ AI 设置（第一次用要填一次）</summary>
  <label>DeepSeek API Key</label>
  <input id="key" type="password" placeholder="sk-...（在 platform.deepseek.com 创建）">
  <div class="row" style="margin-top:10px">
    <button id="savekey" style="padding:11px;font-size:14px">保存</button>
  </div>
  <div class="hint">Key 只存在你这台手机的浏览器里，不会上传。填完一次，以后自动用。</div>
</details>

<label>客户的提问</label>
<input id="q" type="text" placeholder="例如：最近工作状态很差，想调整但不知道从哪下手">

<label>牌阵</label>
<div class="spreads" id="spreads"></div>

<div class="row">
  <button id="draw">抽 牌</button>
  <button id="copy">复制解读</button>
</div>

<div id="out">
  <div id="cards" style="margin-top:20px"></div>
  <button id="gen">✨ AI 生成解读</button>
  <button id="share">📷 生成牌阵图</button>
  <div id="sharewrap" style="display:none">
    <img id="shareimg" alt="牌阵图">
    <div class="hint">长按图片 → 存储到照片，直接发给客户</div>
  </div>
  <pre id="text"></pre>
  <div class="hint" id="hint"></div>
</div>

<div class="toast" id="toast"></div>

/* ---------- 可复现随机 ---------- */
function lcg(seed){
  let s = seed >>> 0;
  return function(){
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function shuffle(arr, rnd){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function drawCards(n, seed){
  const rnd = lcg(seed);
  const ids = Object.keys(DATA.cards);
  const picked = shuffle(ids, rnd).slice(0,n);
  return picked.map(id=>({
    id,
    reversed: rnd() < 0.42
  }));
}

function kwList(card, rev){
  return (rev ? card.rev : card.up) || [];
}

function hash(s){ let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))>>>0; return h; }
function pick(arr, key){ return arr[hash(key)%arr.length]; }

const ORIENT_UP = [
  '牌是正的，这股劲儿现在推得动。',
  '正位的能量是舒展的，可以顺着它走。',
  '这张牌立着，说明这一块眼下没有卡死。'
];
const ORIENT_REV = [
  '逆位不是坏事，只是这股劲儿还没走顺——可能压在心里，也可能用错了力道。',
  '牌倒着，说明这一块先别硬推，看清楚它卡在哪儿更要紧。',
  '逆位更像「还没到位」：方向也许没错，是时机或力道不对。'
];
const TAIL = ['另一面是', '也连着', '旁边还有'];

function composeCard(cardId, rev, position, idx){
  const c = DATA.cards[cardId];
  const kws = kwList(c, rev);
  const k1 = kws[0] || '';
  const k2 = kws[1] || '';
  const frame = POS_FRAME[position] || '这张牌说的是';
  const orient = rev ? '逆位' : '正位';

  const line1 = `${frame}「${k1}${k2 ? '、' + k2 : ''}」。`;
  const line2 = (rev ? ORIENT_REV : ORIENT_UP)[idx % 3];

  let line3 = '';
  const rest = kws.slice(2,4);
  if(rest.length){
    line3 = `${TAIL[idx % TAIL.length]}「${rest.join('、')}」，可以一起看。`;
  }
  return `${'①②③④⑤'[idx] || (idx+1)} ${c.name}（${orient}）｜${position}\n${line1}${line2}${line3}`;
}

function elementStats(drawn){
  const count = {};
  let major = 0, revN = 0;
  drawn.forEach(d=>{
    const a = DATA.arcana[d.id];
    if(a.arcana === 'major'){ major++; }
    else {
      const el = DATA.suits[a.suit].element;
      count[el] = (count[el]||0)+1;
    }
    if(d.reversed) revN++;
  });
  return {count, major, revN};
}

function buildReading(question, spreadKey, drawn, seed){
  const sp = DATA.spreads[spreadKey];
  const now = new Date();
  const ts = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')
    +' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

  let out = '';
  out += `【塔罗${sp.name}解读】\n`;
  if(question) out += `提问：${question}\n`;
  out += `牌阵：${sp.name}（${sp.positions.join(' → ')}）\n`;
  out += `抽牌存档：seed ${seed} · ${ts}\n`;
  out += `这个 seed 你随时可以复查，牌面不会变。\n\n`;

  out += `── 牌面 ──\n`;
  drawn.forEach((d,i)=>{
    out += `${i+1}. ${sp.positions[i]} —— ${DATA.cards[d.id].name} · ${d.reversed?'逆位':'正位'}\n`;
  });
  out += `\n`;

  out += `── 逐张 ──\n`;
  drawn.forEach((d,i)=>{
    out += composeCard(d.id, d.reversed, sp.positions[i], i) + `\n\n`;
  });

  const st = elementStats(drawn);
  const elParts = Object.entries(st.count).map(([k,v])=>`${k} ${v}`).join(' · ');
  out += `── 整体 ──\n`;
  if(elParts) out += `元素：${elParts}\n`;
  out += `大牌 ${st.major}/${drawn.length}`;
  if(st.major === 0) out += `（日常选择主导，主动权在你手上）`;
  else if(st.major >= drawn.length/2) out += `（大牌偏多，这确实是个转折点）`;
  else out += `（命运和选择各占一半）`;
  out += `\n`;
  out += `逆位 ${st.revN}/${drawn.length}`;
  if(st.revN > drawn.length/2) out += `（现在更多是在收，不急着推）`;
  else out += `（推的和收的都有）`;
  out += `\n\n`;

  out += `── 怎么看 ──\n`;
  if(st.revN > drawn.length/2){
    out += `这几张里逆位偏多，说明你现在不太是在“往外做”，更像是在“往里收”。这时候硬推反而更累，先把卡住的那一处说清楚，比急着改变有用。\n\n`;
  }else{
    out += `牌面正逆都有，说明有能推的地方，也有要缓的地方。先从推得动的那一块下手，别一次全动。\n\n`;
  }

  out += `── 这周可以做的一件事 ──\n`;
  const advIdx = sp.positions.findIndex(p=>p.includes('建议'));
  const adviceCard = advIdx >= 0 ? drawn[advIdx] : drawn[drawn.length-1];
  const akws = kwList(DATA.cards[adviceCard.id], adviceCard.reversed);
  if(adviceCard.reversed){
    out += `建议这一张是逆位，意思是别再往「${akws[0]}」这个方向加码了——反着来：这周挑一件具体的事，把「${akws[0]}」先停一停，看看会发生什么。\n\n`;
  }else{
    out += `顺着「${akws[0]}」这个方向，挑一件 30 分钟内能开头的小事，本周内做掉。不用一次想清楚，先把脚迈出去。\n\n`;
  }

  out += `——\n`;
  out += `塔罗反映的是当下的状态，不是对未来的预测。\n`;
  out += `牌面只负责把你在回避的那部分翻出来；走向怎么变，是你的选择决定的。\n`;

  return out;
}

function toast(msg){

  t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 1600);
}

document.getElementById('draw').onclick = ()=>{
  const q = document.getElementById('q').value.trim();
  const sk = document.querySelector('.sp.on').dataset.k;
  const sp = DATA.spreads[sk];
  const seed = Math.floor(Math.random()*1e9);
  const drawn = drawCards(sp.positions.length, seed);

  cur = {q, sk, drawn, seed};

  const box = document.getElementById('cards');
  box.innerHTML = '';
  drawn.forEach((d,i)=>{
    const el = document.createElement('div');
    el.className = 'cardrow';
    el.innerHTML = `<div class="idx">${i+1}</div>
      <img src="assets/cards/${d.id}.jpg" class="${d.reversed?'rev':''}" alt="">
      <div><div class="nm">${DATA.cards[d.id].name}</div>
      <div class="pos">${sp.positions[i]}</div></div>
      <div class="rev">${d.reversed?'逆位':'正位'}</div>`;
    box.appendChild(el);
  });

  document.getElementById('text').textContent = buildReading(q, sk, drawn, seed);
  document.getElementById('out').style.display = 'block';
  document.getElementById('out').scrollIntoView({behavior:'smooth', block:'start'});

  if(typeof getKey === 'function' && getKey()){
    doAiRead();
  }else{
    document.getElementById('hint').textContent =
      '上面是模板速读。正式版要点「✨ AI 生成解读」——先去最上面「⚙️ AI 设置」填一次 Key。';
  }
};

- 健康、疾病 → 不给诊断和建议，建议就医，然后聊他的焦虑
- 法律纠纷、官司 → 不判断输赢，聊他现在的处境和能做的准备
- "会不会复合""什么时候能遇到" → 不给时间点和答案，帮他看清自己真正想要什么

输出纯文本，不要用 Markdown 的 # 号标题。`;

function headerOf(q, sp, drawn, seed){
  const now = new Date();
  const ts = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')
    +' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  let h = `【塔罗解读】\n`;
  if(q) h += `提问：${q}\n`;
  h += `牌阵：${sp.name}\n`;
  h += `抽牌存档：seed ${seed} · ${ts}\n\n`;
  drawn.forEach((d,i)=>{
    h += `${i+1}. ${sp.positions[i]} —— ${DATA.cards[d.id].name} · ${d.reversed?'逆位':'正位'}\n`;
  });
  return h;
}

async function doAiRead(){
  if(!cur){ toast('先抽牌'); return; }
  const k = getKey();
  if(!k){ toast('先填 API Key'); return; }
  const btn = document.getElementById('gen');
  const sp = DATA.spreads[cur.sk];
  const {q, drawn, seed} = cur;

  const cardLines = drawn.map((d,i)=>
    `${i+1}. 位置：${sp.positions[i]}　牌：${DATA.cards[d.id].name}　${d.reversed?'逆位':'正位'}`);
  const userMsg = `客户的问题：${q || '（没有具体问题，做整体解读）'}\n\n已抽好的牌（既定结果，不要改动）：\n${cardLines.join('\n')}\n\n请写解读。`;

  btn.disabled = true;
  btn.innerHTML = '<span class="spin">◌</span> 生成中…';
  try{
    const r = await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
      body: JSON.stringify({
        model:'deepseek-chat',
        messages:[{role:'system',content:SYS_PROMPT},{role:'user',content:userMsg}],
        temperature:0.8,
        max_tokens:2000
      })
    });
    if(!r.ok){
      const t = await r.text();
      throw new Error('HTTP '+r.status+' '+t.slice(0,120));
    }
    const j = await r.json();
    const body = (j.choices?.[0]?.message?.content || '').trim();
    if(!body) throw new Error('返回为空');

    document.getElementById('text').textContent =
      body +
      '\n\n——\n' +
      `本次抽牌存档：seed ${seed}，牌面可复查。\n` +
      '塔罗反映的是当下的状态，不是对未来的预测。';
    document.getElementById('hint').textContent =
      `已生成 ${body.length} 字。客户问"是不是编的"，把 seed ${seed} 给他。`;
  }catch(e){
    document.getElementById('text').textContent = buildReading(q, cur.sk, drawn, seed);
    document.getElementById('hint').textContent =
      'AI 调用失败：' + e.message + '　已回退到模板解读。检查 Key 是否正确、余额是否够。';
  }finally{
    btn.disabled = false;
    btn.textContent = '✨ AI 生成解读';
  }
}
document.getElementById('gen').onclick = doAiRead;

/* ---------- 牌阵图 ---------- */
function loadImg(src){
  return new Promise((res,rej)=>{
    const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error(src)); im.src=src;
  });
}
function wrapLines(ctx, text, maxW){
  const lines=[]; let line='';
  for(const ch of text){
    if(ch==='\n'){ lines.push(line); line=''; continue; }
    const t=line+ch;
    if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=ch; }
    else line=t;
  }
  if(line) lines.push(line);
  return lines;
}

/* 木纹桌面底 */
/* 可复现随机 */
function mulberry(seed){
  let t = seed >>> 0;
  return function(){
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

/* 四种场景，每次抽牌随机挑一个 */
const SCENES = {
  wood:  { paper:'#EFE7D9', ink:'#3B2E24', sub:'rgba(80,64,50,.72)', name:'深木桌' },
  linen: { paper:'#F3EDE2', ink:'#3E332A', sub:'rgba(90,74,60,.72)', name:'亚麻布' },
  felt:  { paper:'#EAE4D6', ink:'#33302A', sub:'rgba(80,74,64,.72)', name:'墨绿绒' },
  stone: { paper:'#F6F2EA', ink:'#40372E', sub:'rgba(95,80,66,.72)', name:'米石' }
};

function bgWood(g, W, H, rnd){
  const grad = g.createLinearGradient(0, 0, W * .35, H);
  grad.addColorStop(0, '#4E3C2E'); grad.addColorStop(.45, '#3D2E23'); grad.addColorStop(1, '#2A1F18');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 150; i++){
    const y0 = rnd() * H, a = .015 + rnd() * .055;
    g.beginPath(); g.moveTo(0, y0);
    let cy = y0;
    for (let x = 0; x <= W; x += 55){ cy += (rnd() - .5) * 8; g.lineTo(x, cy); }
    g.strokeStyle = rnd() > .45 ? `rgba(255,228,196,${a})` : `rgba(0,0,0,${a + .03})`;
    g.lineWidth = .5 + rnd() * 2.4; g.stroke();
  }
  for (let k = 0; k < 2 + Math.floor(rnd() * 2); k++){
    const kx = rnd() * W, ky = rnd() * H, kr = 6 + rnd() * 14;
    for (let ring = 0; ring < 5; ring++){
      g.beginPath();
      g.ellipse(kx, ky, kr * (1 + ring * .55) * .45, kr * (1 + ring * .55), rnd() * 3, 0, 7);
      g.strokeStyle = `rgba(0,0,0,${.05 + rnd() * .05})`; g.lineWidth = 1.2; g.stroke();
    }
  }
}

function bgLinen(g, W, H, rnd){
  g.fillStyle = '#D9CFBE'; g.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 3){
    g.fillStyle = `rgba(255,250,240,${.05 + rnd() * .10})`;
    g.fillRect(0, y, W, 1.2);
  }
  for (let x = 0; x < W; x += 3){
    g.fillStyle = `rgba(90,74,58,${.03 + rnd() * .06})`;
    g.fillRect(x, 0, 1.2, H);
  }
  for (let i = 0; i < 40; i++){
    const cx = rnd() * W, cy = rnd() * H, r = 20 + rnd() * 90;
    const rg = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    rg.addColorStop(0, `rgba(0,0,0,${rnd() * .05})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
}

function bgFelt(g, W, H, rnd){
  const grad = g.createLinearGradient(0, 0, W * .3, H);
  grad.addColorStop(0, '#39463E'); grad.addColorStop(.5, '#28322C'); grad.addColorStop(1, '#1B2320');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 14000; i++){
    const a = rnd() * .07;
    g.fillStyle = rnd() > .5 ? `rgba(255,255,245,${a})` : `rgba(0,0,0,${a})`;
    g.fillRect(rnd() * W, rnd() * H, 1.6, 1.6);
  }
}

function bgStone(g, W, H, rnd){
  const grad = g.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#F2EDE3'); grad.addColorStop(.55, '#E5DDD0'); grad.addColorStop(1, '#D2C7B6');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  for (let v = 0; v < 5; v++){
    g.beginPath();
    let x = -20, y = rnd() * H;
    g.moveTo(x, y);
    for (; x < W + 20; x += 40){
      y += (rnd() - .5) * 55;
      g.quadraticCurveTo(x + 20, y + (rnd() - .5) * 30, x + 40, y);
    }
    g.strokeStyle = `rgba(140,124,104,${.08 + rnd() * .10})`;
    g.lineWidth = .8 + rnd() * 2.6; g.stroke();
  }
  for (let i = 0; i < 2600; i++){
    g.fillStyle = `rgba(120,104,86,${rnd() * .05})`;
    g.fillRect(rnd() * W, rnd() * H, 1.4, 1.4);
  }
}

const BG_FN = { wood: bgWood, linen: bgLinen, felt: bgFelt, stone: bgStone };

/* 光 */
function lightWash(g, W, H, rnd){
  const corners = [[0, 0], [W, 0], [0, H], [W, H]];
  const [lx, ly] = corners[Math.floor(rnd() * 4)];
  const rg = g.createRadialGradient(lx, ly, 0, lx, ly, Math.max(W, H) * 1.05);
  const warm = rnd() > .3;
  rg.addColorStop(0, warm ? 'rgba(255,240,210,.20)' : 'rgba(240,245,255,.16)');
  rg.addColorStop(.45, 'rgba(255,255,255,.05)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}

function vignette(g, W, H){
  const vg = g.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .22, W / 2, H * .5, Math.max(W, H) * .82);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.42)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}

function grain(g, W, H, rnd, amount){
  for (let i = 0; i < amount; i++){
    const a = rnd() * .045;
    g.fillStyle = rnd() > .5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;
    g.fillRect(rnd() * W, rnd() * H, 1.5, 1.5);
  }
}

document.getElementById('share').onclick = async ()=>{
  if(!cur){ toast('先抽牌'); return; }
  const btn = document.getElementById('share');
  btn.disabled = true; btn.textContent = '生成中…';
  try{
    const sp = DATA.spreads[cur.sk], q = cur.q, drawn = cur.drawn, seed = cur.seed, n = drawn.length;
    const rnd = mulberry(seed ^ (Date.now() & 0xffff));
    const scene = Object.keys(SCENES)[Math.floor(rnd() * 4)];
    const scr = SCENES[scene];

    const W = 900, CW = 232, CH = Math.round(CW * 1919 / 1144);
    const PAD = 92, photoH = CH + PAD * 2;
    const CAPH = 206, H = photoH + CAPH;

    /* ---- 照片区（单独画布，带轻微手持倾斜）---- */
    const photo = document.createElement('canvas');
    photo.width = W; photo.height = photoH;
    const pg = photo.getContext('2d');

    pg.save();
    const tilt = (rnd() - .5) * 0.035;
    pg.translate(W / 2, photoH / 2); pg.rotate(tilt); pg.scale(1.06, 1.06); pg.translate(-W / 2, -photoH / 2);
    BG_FN[scene](pg, W, photoH, rnd);
    pg.restore();

    lightWash(pg, W, photoH, rnd);

    /* 牌位 */
    const margin = 56;
    const avail = W - margin * 2 - CW;
    let step = n > 1 ? avail / (n - 1) : 0;
    step = Math.min(step, CW * 1.22);
    const rowW = CW + step * (n - 1);
    const startX = (W - rowW) / 2;
    const baseY = PAD;

    const imgs = await Promise.all(drawn.map(d=>loadImg('assets/cards/' + d.id + '.jpg')));
    const useFan = rnd() > .55;

    drawn.forEach((d, i)=>{
      const jx = (rnd() - .5) * 16;
      const jy = (rnd() - .5) * 18;
      const cx = startX + step * i + CW / 2 + jx;
      const cy = baseY + CH / 2 + jy + (useFan ? Math.abs(i - (n - 1) / 2) * 9 : 0);

      let ang = (rnd() - .5) * .085;
      if(useFan) ang += (i - (n - 1) / 2) * 0.055;

      const rot = ang + (d.reversed ? Math.PI : 0);

      /* 影 */
      pg.save();
      pg.translate(cx + 8 + jx * .3, cy + 12);
      pg.rotate(ang);
      pg.filter = 'blur(13px)';
      pg.fillStyle = 'rgba(0,0,0,.45)';
      pg.fillRect(-CW / 2, -CH / 2, CW, CH);
      pg.restore();
      pg.filter = 'none';

      /* 牌 */
      pg.save();
      pg.translate(cx, cy); pg.rotate(rot);
      pg.shadowColor = 'rgba(0,0,0,.45)'; pg.shadowBlur = 5; pg.shadowOffsetY = 2;
      pg.drawImage(imgs[i], -CW / 2, -CH / 2, CW, CH);
      pg.restore();

      /* 边光 */
      pg.save();
      pg.translate(cx, cy); pg.rotate(ang);
      pg.strokeStyle = 'rgba(255,244,222,.18)'; pg.lineWidth = 1.1;
      pg.strokeRect(-CW / 2, -CH / 2, CW, CH);
      pg.restore();
    });

    vignette(pg, W, photoH);
    grain(pg, W, photoH, rnd, 9000);

    /* ---- 拼成整张 ---- */
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');

    g.fillStyle = scr.paper; g.fillRect(0, 0, W, H);
    g.drawImage(photo, 0, 0);

    /* 照片下沿的一道浅影，像纸片压着 */
    const sh = g.createLinearGradient(0, photoH, 0, photoH + 26);
    sh.addColorStop(0, 'rgba(0,0,0,.16)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sh; g.fillRect(0, photoH, W, 26);

    /* ---- 说明区 ---- */
    g.textAlign = 'center';

    g.fillStyle = scr.ink;
    g.font = '500 30px "PingFang SC","Microsoft YaHei",sans-serif';
    const qlines = wrapLines(g, q ? '「' + q + '」' : sp.name, 780).slice(0, 1);
    g.fillText(qlines[0] || sp.name, W / 2, photoH + 62);

    g.fillStyle = scr.sub;
    g.font = '21px "PingFang SC","Microsoft YaHei",sans-serif';
    const names = drawn.map((d, i)=>
      sp.positions[i].split(' / ')[0] + ' ' + DATA.cards[d.id].name + (d.reversed ? '（逆）' : '')
    ).join('   ·   ');
    const nlines = wrapLines(g, names, 800).slice(0, 2);
    nlines.forEach((ln, i)=> g.fillText(ln, W / 2, photoH + 104 + i * 30));

    g.fillStyle = 'rgba(110,95,80,.55)';
    g.font = '17px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('seed ' + seed + '　·　仅供娱乐参考，不预测未来', W / 2, H - 34);

    document.getElementById('shareimg').src = c.toDataURL('image/jpeg', 0.92);
    document.getElementById('sharewrap').style.display = 'block';
    document.getElementById('sharewrap').scrollIntoView({behavior:'smooth', block:'center'});
  }catch(e){
    toast('生成失败：' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = '📷 生成牌阵图';
  }
};

document.getElementById('copy').onclick = async ()=>{
  if(!cur){ toast('先抽牌'); return; }
  const txt = document.getElementById('text').textContent;
  try{
    await navigator.clipboard.writeText(txt);
    toast('已复制');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('已复制');
  }
};
